name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified CLI version
        shell: pwsh
        run: npm install --global @openai/codex@0.153.4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -SkipPublish
